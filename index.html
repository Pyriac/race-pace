<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1411" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Calculez vos temps de passage au Tour du Nipalou et gardez-les en fond d'écran." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <script>
      // Thème Jour / Nuit du design system : suit le réglage du système.
      (function () {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var apply = function () {
          document.documentElement.setAttribute('data-theme', mq.matches ? 'dark' : 'light');
        };
        apply();
        mq.addEventListener('change', apply);
      })();
    </script>
    <title>Temps de passage — Tour du Nipalou</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
